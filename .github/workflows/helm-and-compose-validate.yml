name: helm-and-compose-validate

on:
  push:
    branches: [main]
    paths:
      - 'helm/**'
      - 'docker-compose.yaml'
      - 'docker-compose.yml'
      - '.github/workflows/helm-and-compose-validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'helm/**'
      - 'docker-compose.yaml'
      - 'docker-compose.yml'
      - '.github/workflows/helm-and-compose-validate.yml'

concurrency:
  group: helm-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm-lint:
    name: helm lint helm/
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: latest
      - name: helm lint helm/
        run: helm lint helm/

  docker-compose-config:
    name: docker compose config -q
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Stub values so docker compose substitution does not warn-and-fail.
      # The compose file references ${OPENAI_API_KEY}, ${OPENAI_MODEL},
      # ${LOG_LEVEL} — dummies are fine for `config -q` since it only
      # validates structure and resolves interpolations.
      OPENAI_API_KEY: dummy-api-key-for-ci-validation
      OPENAI_MODEL: gpt-4-turbo-preview
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose file syntax
        run: |
          if [ -f docker-compose.yaml ]; then
            docker compose -f docker-compose.yaml config -q
          elif [ -f docker-compose.yml ]; then
            docker compose -f docker-compose.yml config -q
          else
            echo "No docker-compose file found; nothing to validate."
          fi
