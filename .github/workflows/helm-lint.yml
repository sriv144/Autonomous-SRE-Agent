name: helm-lint

on:
  push:
    branches: [main]
    paths:
      - 'helm/**'
      - '.github/workflows/helm-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - 'helm/**'
      - '.github/workflows/helm-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm-lint:
    name: helm lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: helm lint helm/
        run: helm lint helm/

      - name: helm template helm/ (render check)
        run: |
          helm template kubesentient helm/ \
            --namespace kubesentient \
            --set image.repository=ghcr.io/sriv144/kubesentient \
            --set image.tag=ci > /dev/null
