name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python 3.11, Poetry)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Tests are fully mocked per README; these dummies satisfy any
      # module-level env reads without contacting external services.
      OPENAI_API_KEY: sk-ci-dummy-key
      WEAVIATE_URL: http://localhost:8080
      LOG_LEVEL: WARNING

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          pipx install poetry==1.7.1
          poetry config virtualenvs.in-project true

      - name: Cache Poetry venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Compile-all syntax check
        run: poetry run python -m compileall -q src tests

      - name: Pytest
        run: poetry run pytest tests/ -v --tb=short
