name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest + ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true
      - name: Install project
        run: poetry install --no-interaction --no-ansi
      - name: Lint (ruff)
        run: poetry run python -m pip install ruff && poetry run ruff check src tests scripts || true
      - name: Run tests
        env:
          OPENAI_API_KEY: sk-dummy-for-tests-only
          WEAVIATE_URL: http://localhost:8080
        run: poetry run pytest tests/ -v
