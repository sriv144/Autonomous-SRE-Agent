name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    env:
      # Tests are designed to be fully mocked — no real OpenAI / Weaviate calls.
      # The placeholder satisfies any client that asserts on key presence.
      OPENAI_API_KEY: sk-ci-placeholder
      WEAVIATE_URL: http://localhost:8080

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: poetry-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock', 'pyproject.toml') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with dev

      - name: Install project
        run: poetry install --no-interaction

      - name: Lint with black (check only)
        run: poetry run black --check src tests
        continue-on-error: true
        # Style enforcement is informational while the codebase converges.

      - name: Lint with isort (check only)
        run: poetry run isort --check-only src tests
        continue-on-error: true

      - name: Typecheck with mypy
        run: poetry run mypy src
        continue-on-error: true

      - name: Run pytest
        run: poetry run pytest tests/ -v
