name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Poetry
        run: pip install poetry==1.7.1

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run pytest (fully mocked, no external services)
        env:
          OPENAI_API_KEY: "sk-test-do-not-use"
          WEAVIATE_URL: "http://localhost:8080"
        run: poetry run pytest tests/ -v --maxfail=1 --disable-warnings
