name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install ruff
        run: pip install --upgrade pip ruff
      - name: Ruff check
        run: ruff check src tests --output-format=github || true

  test:
    name: Pytest (mocked, no live services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Poetry
        run: pip install --upgrade pip poetry
      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi
      - name: Run tests
        env:
          # Tests are fully mocked; supply dummy keys so importing modules that
          # construct the LLM client at module load doesn't fail.
          OPENAI_API_KEY: sk-test-dummy
          ANTHROPIC_API_KEY: sk-ant-test-dummy
          LLM_PROVIDER: openai
        run: poetry run pytest tests/ -v

  llm-provider-unit:
    name: LLM provider unit smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal deps
        run: pip install --upgrade pip langchain-openai langchain-anthropic langchain-core
      - name: Import factory
        env:
          OPENAI_API_KEY: sk-test-dummy
          LLM_PROVIDER: openai
        run: python -c "from src.agent_core.llm_provider import build_llm; print(type(build_llm()).__name__)"
      - name: Import factory (anthropic path)
        env:
          ANTHROPIC_API_KEY: sk-ant-test-dummy
          LLM_PROVIDER: anthropic
        run: python -c "from src.agent_core.llm_provider import build_llm; print(type(build_llm()).__name__)"
