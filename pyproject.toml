[tool.poetry]
name = "kubesentient"
version = "0.2.0"
description = "Autonomous SRE agent for Kubernetes, powered by Anthropic Claude"
authors = ["SRE Team <sre@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
langgraph = "^0.2.0"
langchain-anthropic = "^0.2.0"
langchain-core = "^0.2.0"
anthropic = "^0.40.0"
kubernetes = "^29.0.0"
fastapi = "^0.109.0"
weaviate-client = "^4.4.0"
pydantic = "^2.6.0"
uvicorn = "^0.27.0"
python-multipart = "^0.0.9"
httpx = "^0.26.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.26.0"
black = "^24.1.0"
isort = "^5.13.0"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
